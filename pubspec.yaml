name: exodus
description: God's design. Unfiltered. Bible-based AI counsel for young couples.
publish_to: 'none'
version: 0.1.0+62

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # Declared rather than leaned on transitively (Amplify pulls it in):
  # the force-update screen is useless if it cannot open the update link.
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.0
  flutter_dotenv: ^5.1.0
  gpt_markdown: ^1.0.16
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  flutter_webrtc: ^0.12.5
  flutter_local_notifications: ^18.0.1
  # Remote push. flutter_local_notifications only SCHEDULES on the device; it
  # cannot receive anything a server sends, which is why nothing could reach a
  # phone before this.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  timezone: ^0.9.4
  # 1.0.8 still referenced PluginRegistry.Registrar (the v1 Android embedding),
  # which no longer exists in the engine — it fails to compile on Android at all.
  flutter_timezone: ^5.1.0
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  amplify_api: ^2.6.0
  cupertino_icons: ^1.0.6
  share_plus: ^13.3.0
  # Voice input. Records the clip that is then transcribed; the platform's
  # own live dictation stops at the first pause and mangles references.
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/bible/
    - assets/textures/
    # Scripture-card artwork. Discovered at runtime from the asset manifest,
    # so dropping a file in is all that is needed — see the folder's README.
    - assets/backgrounds/
    # The illustrated Bible: plates, ornaments and their catalogue. Made by
    # tools/bible_art (see its README).
    - assets/bible_art/
    - assets/bible_art/plates/
    - assets/bible_art/vignettes/
    - assets/bible_art/book/

  # Spectral (SIL Open Font License 1.1, see assets/fonts/OFL.txt). The reply
  # body is set in it — EXODUS's answers are long-form devotional prose, and a
  # serif at a reading measure is what makes them read as scripture-adjacent
  # rather than as chat. Note the theme's `fontFamily: 'Inter'` was never
  # bundled, so the UI sans has always been the platform default.
  fonts:
    # Cormorant Garamond (SIL OFL 1.1, assets/fonts/OFL-CormorantGaramond.txt):
    # the Bible's chapter titles, drop caps and plate captions. Variable, so
    # weights are set with FontVariation('wght', …).
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          style: italic
    # Cinzel (SIL OFL 1.1, assets/fonts/OFL-Cinzel.txt): the inscriptional
    # capitals cut into the stone chapter picker. Variable, like Cormorant.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Light.ttf
          weight: 300
        - asset: assets/fonts/Spectral-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Spectral-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  image_path: "assets/icon/exodus_icon.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0A0E1A"
  # The shield occupies roughly the middle half of the 1024px canvas, so it
  # clears the adaptive-icon safe zone even with launcher parallax zoom — the
  # same artwork can serve as the foreground without a separate crop.
  android: "ic_launcher"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/exodus_icon.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/icon/exodus_icon.png"
    background_color: "#0A0E1A"
    theme_color: "#3B6FE3"
