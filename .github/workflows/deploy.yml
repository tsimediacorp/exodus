name: Deploy to Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy amplify/ (auth, data, functions) as well as the web app'
        type: boolean
        default: true

# Cancel an in-flight run if a newer commit lands on main
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AMPLIFY_APP_ID: d1yaptreocjil0
      AMPLIFY_BRANCH: main
      AWS_REGION: us-east-1
      # A push to main deploys the backend too; a manual run can opt out to
      # ship a frontend-only change without touching infrastructure.
      DEPLOY_BACKEND: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.deploy_backend }}

    steps:
      - uses: actions/checkout@v4

      # AWS first: the backend deploy has to happen before the web bundle is
      # built, so the bundle ships with config matching the backend it will
      # actually talk to.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      # Deploys amplify/ (auth, data, functions) to the backend environment for
      # this branch. Writes amplify_outputs.json, which is gitignored.
      - name: Deploy backend
        if: env.DEPLOY_BACKEND != 'false'
        run: |
          npx ampx pipeline-deploy \
            --branch "$AMPLIFY_BRANCH" \
            --app-id "$AMPLIFY_APP_ID"

      # The app reads its config from lib/amplify_outputs.dart, not from the
      # gitignored JSON — regenerate it so the build picks up schema changes
      # (a new model, a changed endpoint) instead of silently shipping stale
      # config.
      - name: Sync Amplify config into the Dart source
        if: env.DEPLOY_BACKEND != 'false'
        run: npm run sync:outputs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Recreate .env from secret
        run: |
          cat > .env <<EOF
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web bundle
        run: flutter build web --release

      - name: Zip build output
        run: cd build/web && zip -rq ../../web.zip .

      - name: Create Amplify deployment
        id: deployment
        run: |
          RESPONSE=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --output json)
          echo "job_id=$(echo "$RESPONSE" | jq -r .jobId)" >> "$GITHUB_OUTPUT"
          echo "upload_url=$(echo "$RESPONSE" | jq -r .zipUploadUrl)" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Amplify
        run: |
          curl --fail --silent --show-error \
            -X PUT -T web.zip "${{ steps.deployment.outputs.upload_url }}"

      - name: Start deployment
        run: |
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "${{ steps.deployment.outputs.job_id }}"

      - name: Wait for deployment to finish
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "${{ steps.deployment.outputs.job_id }}" \
              --query 'job.summary.status' --output text)
            echo "status=$STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment $STATUS"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for deployment"; exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://main.d1yaptreocjil0.amplifyapp.com" >> "$GITHUB_STEP_SUMMARY"
